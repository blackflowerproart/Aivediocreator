<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ الفيديوهات بالذكاء الاصطناعي</title>
    <!-- تضمين مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
        <h1 class="text-3xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
            صانع الفيديوهات بالذكاء الاصطناعي
        </h1>
        <p class="text-gray-400 text-center mb-8">ارفع صورة أو فيديو، واجعل الذكاء الاصطناعي يحوله لك إلى تحفة فنية.</p>

        <!-- نموذج الرفع -->
        <form id="uploadForm" class="space-y-6">
            
            <!-- منطقة الرفع -->
            <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center hover:border-purple-500 transition cursor-pointer relative bg-gray-900/50">
                <input type="file" id="mediaFile" accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" required>
                <div class="flex flex-col items-center">
                    <svg class="w-12 h-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-sm text-gray-300 font-medium">اضغط هنا لرفع الملف أو اسحبه وأفلته هنا</p>
                    <p class="text-xs text-gray-500 mt-1">يدعم صور (PNG, JPG) وفيديوهات (MP4)</p>
                    <span id="fileName" class="text-xs text-purple-400 mt-3 font-semibold"></span>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                إنشاء الفيديو بالذكاء الاصطناعي 🚀
            </button>
        </form>

        <!-- قسم عرض النتيجة (مخفي مؤقتاً) -->
        <div id="resultSection" class="hidden mt-8 text-center border-t border-gray-700 pt-6">
            <h2 class="text-xl font-semibold mb-4 text-purple-300">النتيجة:</h2>
            <div id="outputContainer" class="bg-gray-900 rounded-xl p-4 flex items-center justify-center min-h-[150px]">
                <p id="statusText" class="text-gray-400 animate-pulse">جاري معالجة الملف بواسطة الذكاء الاصطناعي... يرجى الانتظار.</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('mediaFile');
        const fileNameSpan = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const resultSection = document.getElementById('resultSection');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');

        // ضع رابط السيرفر الخاص بك هنا (عند رفعه على Render، أو استعمل localhost للتجربة المحلية)
        const BACKEND_URL = "http://127.0.0.1:8000/upload/"; 
        // مثال لرابط Render لاحقاً: "https://aivedio-backend.onrender.com/upload/"

        // إظهار اسم الملف المختار
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameSpan.textContent = `الملف المختار: ${e.target.files[0].name}`;
            }
        });

        // إرسال الملف فعلياً إلى السيرفر
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            // إظهار قسم النتيجة بحالة التحميل
            resultSection.classList.remove('hidden');
            statusText.textContent = "جاري رفع الملف إلى الخادم والمعالجة...";
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusText.innerHTML = `
                        <span class="text-green-400 font-bold">✨ تم بنجاح!</span><br>
                        <span class="text-sm text-gray-300 mt-2 block">اسم الملف المستلم: ${data.filename}</span>
                        <p class="text-xs text-gray-500 mt-2">المسار على السيرفر: ${data.saved_path}</p>
                    `;
                } else {
                    throw new Error(data.detail || "حدث خطأ غير معروف أثناء المعالجة.");
                }
            } catch (error) {
                statusText.innerHTML = `<span class="text-red-400">❌ فشل الاتصال بالخادم: تأكد من تشغيل سيرفر البايثون أو صحة الرابط. (${error.message})</span>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
