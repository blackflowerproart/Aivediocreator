<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي السحابية (Groq)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-[#121214] text-zinc-100 h-screen flex flex-col justify-between">

    <!-- الهيدر العلوي -->
    <header class="bg-[#18181b] border-b border-zinc-800 p-4 text-center shadow-md">
        <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">
            ⚡ منصة الذكاء الاصطناعي (Groq Cloud API)
        </h1>
    </header>

    <!-- منطقة المحادثة -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-orange-500 to-amber-500 flex-shrink-0 flex items-center justify-center text-sm font-bold text-white">
                AI
            </div>
            <div class="bg-[#1e1e1e] border border-zinc-800 rounded-2xl rounded-tr-none p-4 max-w-md shadow-sm text-sm text-zinc-300 leading-relaxed">
                مرحباً بك! أنا مساعدك الذكي عبر Groq. جاهز للإجابة على أسئلتك بسرعة البرق. اطلب ما شئت!
            </div>
        </div>
    </main>

    <!-- صندوق الإدخال -->
    <footer class="bg-[#18181b] border-t border-zinc-800 p-4">
        <form id="chatForm" class="max-w-3xl mx-auto flex gap-3 items-center">
            <input 
                type="text" 
                id="promptText" 
                placeholder="اكتب رسالتك أو استفسارك هنا..." 
                autocomplete="off"
                class="flex-1 bg-[#27272a] border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500 transition shadow-inner"
                required
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition shadow-md flex items-center justify-center"
            >
                إرسال 🚀
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
